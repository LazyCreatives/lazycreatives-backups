[project]
name = "ablebackup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",  # uvicorn needs a WS library to serve /ws/progress live
    "apscheduler>=3.10,<4",
    "sentry-sdk>=2.40",  # crash reports, only when Settings > Privacy allows (crashreports.py)
    "imageio-ffmpeg>=0.5",  # ships ffmpeg, so the player can read AIFF, Apple Lossless, WMA...
    "cryptography>=42",     # locks what the phone server sends (phone.py), and the NAS login
    "zeroconf>=0.130",      # finds a NAS on the home network (nas.py)
    "pysmb>=1.2.9",         # asks the NAS for its shared folders (nas.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
